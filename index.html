<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Home - XR Multiplataforma</title>


<!-- AFRAME -->

<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>


<script>

const startTime = performance.now();



/* ===============================
        INICIAR AR
================================ */


async function entrarAR(){


if(!navigator.xr){

alert(
"Este dispositivo no soporta WebXR"
);

return;

}



const disponible =
await navigator.xr.isSessionSupported(
"immersive-ar"
);



if(!disponible){

alert(
"AR no disponible en este navegador"
);

return;

}



try{


await navigator.xr.requestSession(
"immersive-ar",
{

requiredFeatures:[
"local-floor"
],

optionalFeatures:[
"hit-test",
"bounded-floor"
]

});


}

catch(error){

console.log(error);

alert(
"No se pudo iniciar AR"
);

}


}





/* ===============================
        DISPONIBILIDAD XR
================================ */


window.addEventListener(
"load",
async()=>{


let tiempo =
performance.now()-startTime;



document.getElementById(
"loadBadge"
).innerHTML =
"Carga inicial: "
+
tiempo.toFixed(2)
+
" ms";



if(navigator.xr){


let vr =
await navigator.xr.isSessionSupported(
"immersive-vr"
);


let ar =
await navigator.xr.isSessionSupported(
"immersive-ar"
);



document.getElementById(
"xrInfo"
).innerHTML =

"VR: "
+
(vr?"Disponible":"No disponible")
+
"<br>"
+
"AR: "
+
(ar?"Disponible":"No disponible");


}


});




/* ===============================
        FPS
================================ */



setInterval(()=>{


let escena =
document.querySelector(
"a-scene"
);



if(
escena &&
escena.renderer
){


let fps =
Math.round(
1/
escena.frameDuration
);



document.getElementById(
"fps"
).innerHTML =
"FPS: "
+
fps;


}



},1000);



</script>



<style>


body{

margin:0;

overflow:hidden;

font-family:Arial;

}



/* MENU */

.nav-menu{


position:fixed;

top:15px;

right:15px;

z-index:20;

display:flex;

gap:10px;

flex-wrap:wrap;


}



.nav-menu a,
.nav-menu button{


background:
rgba(0,0,0,.75);

color:white;

padding:10px 14px;

border-radius:10px;

border:none;

cursor:pointer;

font-weight:bold;

text-decoration:none;


}




.nav-menu button:hover,
.nav-menu a:hover{

background:black;

}



/* PANEL CARGA */


.load-badge{


position:fixed;

top:70px;

right:15px;

background:white;

padding:10px;

border-radius:10px;

z-index:20;

font-weight:bold;


}



/* INFORMACION */


.info{


position:fixed;

bottom:20px;

left:20px;

background:
rgba(0,0,0,.75);

color:white;

padding:15px;

border-radius:10px;

z-index:20;


}




/* CELULAR */


@media(max-width:768px){


.nav-menu{

left:10px;

right:10px;

display:grid;

grid-template-columns:1fr 1fr;

}



}




</style>


</head>




<body>




<div class="nav-menu">


<a href="index.html">
Home
</a>


<a href="escena.html">
Escena básica
</a>


<a href="banda.html">
Banda
</a>


<a href="robot.html">
Robot
</a>



<button onclick="entrarAR()">

ENTRAR AR

</button>



</div>





<div id="loadBadge" class="load-badge">

Cargando...

</div>




<div id="xrInfo" class="info">

Comprobando XR...

<br>

<span id="fps">

FPS:

</span>


</div>





<a-scene


renderer="

alpha:true;

antialias:true;

colorManagement:true

"


vr-mode-ui="enabled:true"



webxr="

optionalFeatures:

local-floor,

hit-test,

bounded-floor

"

>


<!-- CAMARA -->


<a-entity
position="0 1.6 6">


<a-camera>

</a-camera>


</a-entity>





<!-- LUCES -->


<a-light

type="ambient"

color="#BBB">

</a-light>



<a-light

type="directional"

position="1 4 2"

intensity="1.2">

</a-light>





<!-- PISO -->


<a-plane

position="0 0 0"

rotation="-90 0 0"

width="20"

height="20"

</a-plane>





<!-- PANEL -->


<a-box

position="0 2 -4"

width="7"

height="2.5"

</a-box>





<a-text

value="XR MULTIPLATAFORMA"

position="-2.8 2.5 -3.8"

width="8"

color="white">

</a-text>




<a-text

value="Laboratorio Realidad Virtual"

position="-2.6 2 -3.8"

width="6"

color="#A8DADC">

</a-text>





<!-- OBJETOS DECORATIVOS -->


<a-box

position="-4 1 -5"

rotation="0 25 0"

width="1"

height="1"

depth="1"

color="#4CC9F0">

</a-box>



<a-cylinder

position="0 1 -6"

radius="0.6"

height="1.5"

color="#FFD166">

</a-cylinder>




<a-sphere

position="4 1.2 -5"

radius="0.9"

color="#EF476F">

</a-sphere>






<!-- IMPORTANTE PARA AR -->

<a-sky

color="transparent">

</a-sky>




</a-scene>




</body>


</html>
