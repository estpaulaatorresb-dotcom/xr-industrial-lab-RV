<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Home - XR Multiplataforma</title>


<script>
const startTime = performance.now();
</script>


<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>


<style>

body {

    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;

}


/* MENU */

.nav-menu {

    position:fixed;
    top:16px;
    right:16px;
    z-index:20;

    display:flex;
    flex-wrap:wrap;
    gap:10px;

}


.nav-menu a {

    text-decoration:none;

    background:rgba(0,0,0,0.78);

    color:white;

    padding:10px 14px;

    border-radius:10px;

    font-size:14px;

    font-weight:600;

}


.nav-menu a:hover {

    background:rgba(0,0,0,0.92);

}



/* TIEMPO DE CARGA */

.load-badge {

    position:fixed;

    top:68px;

    right:16px;

    z-index:20;

    background:rgba(255,255,255,0.88);

    color:#111;

    padding:10px 14px;

    border-radius:10px;

    font-size:14px;

    font-weight:700;

}



/* INFORMACION */

.info-badge {


    position:fixed;

    bottom:16px;

    left:16px;

    z-index:20;


    background:rgba(0,0,0,0.72);

    color:white;


    padding:10px 14px;


    border-radius:10px;


    font-size:13px;


    max-width:380px;


}



/* CELULAR */

@media(max-width:768px){


.nav-menu{

    top:12px;

    left:12px;

    right:12px;

    display:grid;

    grid-template-columns:1fr 1fr;

}


.nav-menu a{

    text-align:center;

    font-size:12px;

}


.info-badge{

    left:12px;

    right:12px;

    bottom:90px;

    max-width:none;

}


}



</style>



<script>


window.addEventListener('load',()=>{


const loadTime = performance.now()-startTime;


const badge=document.getElementById("loadBadge");


if(badge){

badge.textContent="Carga inicial: "+loadTime.toFixed(2)+" ms";

}


});


</script>



</head>


<body>



<!-- MENU -->

<div class="nav-menu">


<a href="index.html">
Home
</a>


<a href="escena.html">
Escena básica
</a>


<a href="banda.html">
Banda transportadora
</a>


<a href="robot.html">
Robot CAD
</a>


</div>




<div id="loadBadge" class="load-badge">

Cargando...

</div>




<div class="info-badge">

Portada del laboratorio XR. Usa el menú superior para navegar entre las escenas.

</div>





<!-- ESCENA WEBXR -->

<a-scene

stats

vr-mode-ui="enabled:true"

webxr="optionalFeatures: local-floor, hit-test;"

>


<!-- SISTEMA DE POSICIONAMIENTO -->

<a-entity

id="rig"

position="0 0 0">

</a-entity>





<!-- CAMARA -->

<a-camera

position="0 1.6 0">

</a-camera>





<!-- ILUMINACION -->


<a-light

type="ambient"

color="#BBB">

</a-light>



<a-light

type="directional"

color="#FFF"

intensity="1.1"

position="1 4 2">

</a-light>






<!-- PISO VIRTUAL -->


<a-plane

position="0 0 0"

rotation="-90 0 0"

width="24"

height="24"

color="#D8F3DC">

</a-plane>







<!-- PANEL PRINCIPAL -->


<a-box

position="0 2 -2"

width="7"

height="2.6"

depth="0.25"

color="#1D3557">

</a-box>






<!-- TEXTO -->


<a-text

value="XR MULTIPLATAFORMA"

position="-2.85 2.55 -1.86"

color="#FFFFFF"

width="8">

</a-text>




<a-text

value="Laboratorio de Realidad Virtual"

position="-2.6 1.95 -1.86"

color="#A8DADC"

width="6">

</a-text>




<a-text

value="Selecciona una escena desde el menu superior"

position="-2.55 1.35 -1.86"

color="#F1FAEE"

width="5.6">

</a-text>






<!-- OBJETOS DECORATIVOS -->


<a-box

position="-4 1 -3"

rotation="0 25 0"

width="1.2"

height="1.2"

depth="1.2"

color="#4CC9F0">

</a-box>



<a-cylinder

position="0 1 -4"

radius="0.6"

height="1.6"

color="#FFD166">

</a-cylinder>




<a-sphere

position="4 1.2 -3"

radius="0.9"

color="#EF476F">

</a-sphere>






<!-- FONDO TRANSPARENTE PARA MR -->

<a-sky visible="false">

</a-sky>




</a-scene>



</body>

</html>
