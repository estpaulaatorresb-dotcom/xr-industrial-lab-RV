<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XR Multiplataforma - Home</title>


<script>

const startTime = performance.now();

</script>


<script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>



<style>


body{

margin:0;

overflow:hidden;

font-family:Arial,sans-serif;

}




.nav-menu{


position:fixed;

top:16px;

right:16px;

z-index:20;


display:flex;

flex-wrap:wrap;

gap:10px;


}



.nav-menu a,
.nav-menu button{


text-decoration:none;

background:rgba(0,0,0,0.78);

color:white;


padding:10px 14px;

border-radius:10px;


font-size:14px;

font-weight:600;


border:none;

cursor:pointer;


}



.nav-menu a:hover,
.nav-menu button:hover{


background:rgba(0,0,0,0.95);


}




.load-badge{


position:fixed;

top:68px;

right:16px;


z-index:20;


background:white;

color:#111;


padding:10px 14px;


border-radius:10px;


font-weight:bold;


}





.info-badge{


position:fixed;

bottom:16px;

left:16px;


z-index:20;


background:rgba(0,0,0,0.72);


color:white;


padding:10px 14px;


border-radius:10px;


max-width:380px;


font-size:13px;


}



@media(max-width:768px){


.nav-menu{


left:12px;

right:12px;

top:12px;


display:grid;

grid-template-columns:1fr 1fr;


}



.nav-menu a,
.nav-menu button{


font-size:12px;

text-align:center;


}



.info-badge{


left:12px;

right:12px;


bottom:90px;


max-width:none;


}



}



</style>



<script>


window.addEventListener('load',()=>{


let tiempo =
performance.now()-startTime;


document.getElementById("loadBadge").innerHTML =

"Carga inicial: "

+ tiempo.toFixed(2)

+ " ms";


});



</script>


</head>



<body>



<div class="nav-menu">


<a href="index.html">
Home
</a>


<a href="escena.html">
Escena básica
</a>


<a href="banda.html">
Banda transportadora
</a>


<a href="robot.html">
Robot CAD
</a>


<button id="arButton">
AR Meta Quest
</button>



</div>



<div id="loadBadge" class="load-badge">

Cargando...

</div>



<div class="info-badge">

Portada del laboratorio XR.
Usa el menú para navegar entre las experiencias.

</div>



<a-scene

xr-mode="immersive-ar"

webxr="requiredFeatures: local-floor; optionalFeatures: hit-test, dom-overlay;"

vr-mode-ui="enabled:true"

renderer="colorManagement:true"

stats

>
    <!-- CAMARA -->

<a-entity
position="0 1.6 6">

<a-camera></a-camera>

</a-entity>




<!-- LUZ -->

<a-light

type="ambient"

color="#BBB">

</a-light>



<a-light

type="directional"

color="#FFF"

intensity="1.1"

position="1 4 2">

</a-light>





<!-- SUPERFICIE PARA REALIDAD AUMENTADA -->

<a-plane

id="surface"

rotation="-90 0 0"

width="24"

height="24"

color="#D8F3DC">

</a-plane>





<!-- PANEL PRINCIPAL -->


<a-box


position="0 2 -4"


width="7"


height="2.6"


depth="0.25"


color="#1D3557">


</a-box>




<a-text


value="XR MULTIPLATAFORMA"


position="-2.85 2.55 -3.86"


color="white"


width="8">


</a-text>




<a-text


value="Laboratorio de Realidad Virtual"


position="-2.6 1.95 -3.86"


color="#A8DADC"


width="6">


</a-text>




<a-text


value="Meta Quest WebXR - VR / AR"


position="-2.5 1.35 -3.86"


color="white"


width="5.5">


</a-text>






<!-- OBJETOS 3D -->

<a-box


position="-4 1 -5"


rotation="0 25 0"


width="1.2"


height="1.2"


depth="1.2"


color="#4CC9F0">


</a-box>





<a-cylinder


position="0 1 -6"


radius="0.6"


height="1.6"


color="#FFD166">


</a-cylinder>






<a-sphere


position="4 1.2 -5"


radius="0.9"


color="#EF476F">


</a-sphere>





<!-- MODELO ROBOT -->

<a-entity


gltf-model="models/robotassembly.glb"


position="0 0 -8"


scale="0.5 0.5 0.5">


</a-entity>





<a-sky

color="#ECECEC">

</a-sky>




</a-scene>




<script>


// BOTON PARA META QUEST

document
.getElementById("arButton")
.addEventListener("click",()=>{


let scene =
document.querySelector("a-scene");


if(scene.is("ar-mode")){


scene.exitAR();


}

else{


scene.enterAR();


}


});



</script>



</body>

</html>
