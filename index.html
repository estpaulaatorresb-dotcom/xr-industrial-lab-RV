<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>XR Multiplataforma</title>



<!-- AFRAME -->

<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>



<script>


const tiempoInicio = performance.now();





window.addEventListener(
"load",
()=>{


let tiempo =
performance.now()-tiempoInicio;


document.getElementById(
"latencia"
).innerHTML =

"Carga inicial: "
+
tiempo.toFixed(2)
+
" ms";


});





// FPS

setInterval(()=>{


let escena =
document.querySelector("a-scene");


if(escena){


document.getElementById(
"fps"
).innerHTML =
"Escena activa";


}


},1000);



</script>





<style>


body{

margin:0;

overflow:hidden;

font-family:Arial;

}





/* MENU */

.menu{


position:fixed;

top:15px;

right:15px;

z-index:10;


display:flex;

gap:10px;

flex-wrap:wrap;


}



.menu a,
.menu button{


background:#222;

color:white;

border:none;

padding:12px 16px;

border-radius:10px;

font-weight:bold;

cursor:pointer;

text-decoration:none;


}



.menu a:hover,
.menu button:hover{


background:#555;


}





/* LATENCIA */


#latencia{


position:fixed;

right:20px;

top:80px;

background:white;

padding:12px;

border-radius:10px;

z-index:10;

font-weight:bold;


}





/* INFO */


.info{


position:fixed;

bottom:20px;

left:20px;

background:rgba(0,0,0,.75);

color:white;

padding:15px;

border-radius:10px;

z-index:10;


}





@media(max-width:700px){


.menu{


left:10px;

right:10px;

display:grid;

grid-template-columns:1fr 1fr;


}



}



</style>



</head>





<body>



<!-- MENU -->


<div class="menu">


<a href="index.html">
Home
</a>


<a href="escena.html">
Escena básica
</a>


<a href="banda.html">
Banda
</a>


<a href="robot.html">
Robot CAD
</a>



<a href="ar.html">

AR Celular

</a>



</div>





<div id="latencia">

Cargando...

</div>





<div class="info">


XR Multiplataforma

<br>

<span id="fps">

FPS:

</span>


<br>

VR compatible con WebXR

<br>

AR mediante cámara móvil


</div>









<a-scene


stats


renderer="

alpha:true;

antialias:true;

colorManagement:true;

"



vr-mode-ui="enabled:true"



webxr="

optionalFeatures:

local-floor,

bounded-floor

"

>






<!-- CAMARA -->


<a-camera

position="0 1.6 6">

</a-camera>






<!-- ILUMINACION -->


<a-light

type="ambient"

color="#BBBBBB">

</a-light>



<a-light

type="directional"

position="1 4 2"

intensity="1">

</a-light>







<!-- PISO -->


<a-plane

rotation="-90 0 0"

width="20"

height="20"

color="#D8F3DC">

</a-plane>









<!-- PANEL -->


<a-box


position="0 2 -4"


width="7"


height="2.5"


depth="0.25"


color="#1D3557"


>


</a-box>






<!-- TEXTO -->


<a-text


value="XR MULTIPLATAFORMA"


position="-3 2.5 -3.8"


width="8"


color="white"


>


</a-text>




<a-text


value="Laboratorio Realidad Virtual"


position="-3 2 -3.8"


width="6"


color="#A8DADC"


>


</a-text>









<!-- OBJETOS -->


<a-box

position="-4 1 -5"

width="1"

height="1"

depth="1"

color="#4CC9F0">

</a-box>





<a-cylinder

position="0 1 -6"

radius="0.6"

height="1.5"

color="#FFD166">

</a-cylinder>





<a-sphere

position="4 1 -5"

radius="0.9"

color="#EF476F">

</a-sphere>








<!-- FONDO TRANSPARENTE -->

<a-sky

color="transparent">

</a-sky>





</a-scene>





</body>


</html>
