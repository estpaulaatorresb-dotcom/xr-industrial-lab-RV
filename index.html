<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Home - XR Multiplataforma</title>



<!-- AFRAME WEBXR -->

<script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>



<style>


body{

margin:0;

overflow:hidden;

font-family:Arial,sans-serif;

}



/* MENU */

.nav-menu{

position:fixed;

top:16px;

right:16px;

z-index:20;

display:flex;

gap:10px;

}



.nav-menu a{

background:rgba(0,0,0,0.8);

color:white;

padding:10px 16px;

border-radius:10px;

text-decoration:none;

font-weight:bold;

}



.nav-menu a:hover{

background:#444;

}





/* INFORMACION */

.info-badge{


position:fixed;

bottom:20px;

left:20px;

z-index:20;

background:rgba(0,0,0,0.75);

color:white;

padding:15px;

border-radius:10px;

font-size:14px;


}





</style>



</head>





<body>




<!-- MENU -->

<div class="nav-menu">


<a href="index.html">

Home

</a>



<a href="escena.html">

Escena básica

</a>



<a href="banda.html">

Banda transportadora

</a>



<a href="robot.html">

Robot CAD

</a>


</div>








<div class="info-badge">


Portada del laboratorio XR<br>

Compatible con PC y Meta Quest<br>

Modo VR + Mixed Reality


</div>









<a-scene


id="scene"


renderer="alpha:true;colorManagement:true"


vr-mode-ui="enabled:true"


webxr="optionalFeatures:local-floor,bounded-floor,hit-test"


>


<!-- CAMARA CONTROLADA POR QUEST -->


<a-entity id="rig">


<a-camera

position="0 1.6 0">

</a-camera>


</a-entity>







<!-- ILUMINACION -->


<a-light

type="ambient"

color="#FFFFFF"

intensity="1">

</a-light>



<a-light

type="directional"

position="2 4 2"

intensity="1">

</a-light>







<!-- PISO -->

<!-- Visible en VR, transparente para AR -->

<a-plane


rotation="-90 0 0"


width="20"


height="20"


color="#D8F3DC">


</a-plane>









<!-- PANEL CENTRAL -->


<a-box


position="0 2 -4"


width="7"


height="2.5"


depth="0.25"


color="#1D3557">


</a-box>








<a-text


value="XR MULTIPLATAFORMA"


position="-3 2.5 -3.85"


color="white"


width="8">


</a-text>







<a-text


value="Laboratorio de Realidad Virtual"


position="-2.7 2 -3.85"


color="#A8DADC"


width="6">


</a-text>







<a-text


value="Selecciona una escena"


position="-2.4 1.5 -3.85"


color="white"


width="5">


</a-text>









<!-- OBJETOS DECORATIVOS -->


<a-box


position="-4 1 -5"


rotation="0 25 0"


width="1.2"


height="1.2"


depth="1.2"


color="#4CC9F0">


</a-box>







<a-cylinder


position="0 1 -6"


radius="0.6"


height="1.5"


color="#FFD166">


</a-cylinder>







<a-sphere


position="4 1.2 -5"


radius="0.9"


color="#EF476F">


</a-sphere>









<!-- FONDO -->

<!-- IMPORTANTE PARA AR -->

<a-sky

visible="false">

</a-sky>





</a-scene>




</body>


</html>
