<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Home - XR Multiplataforma</title>



<script>

const startTime = performance.now();

</script>




<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>




<style>


body{

margin:0;

overflow:hidden;

font-family:Arial,sans-serif;

}





.nav-menu{


position:fixed;

top:16px;

right:16px;

z-index:20;

display:flex;

gap:10px;

flex-wrap:wrap;


}





.nav-menu a{


background:rgba(0,0,0,0.8);

color:white;

padding:10px 14px;

border-radius:10px;

text-decoration:none;

font-weight:bold;


}





.nav-menu a:hover{

background:black;

}





.load-badge{


position:fixed;

top:75px;

right:16px;

z-index:20;

background:white;

padding:10px 14px;

border-radius:10px;

font-weight:bold;


}






.info-badge{


position:fixed;

bottom:20px;

left:20px;

z-index:20;


background:rgba(0,0,0,0.75);


color:white;

padding:15px;

border-radius:10px;


}






@media(max-width:700px){


.nav-menu{


left:10px;

right:10px;

display:grid;

grid-template-columns:1fr 1fr;


}




.nav-menu a{


text-align:center;

font-size:12px;


}


}



</style>





<script>


window.addEventListener("load",()=>{


const tiempo = performance.now()-startTime;


document.getElementById("loadBadge").innerHTML =


"Carga inicial: "

+

tiempo.toFixed(2)

+

" ms";



});



</script>




</head>






<body>





<div class="nav-menu">


<a href="index.html">

Home

</a>



<a href="escena.html">

Escena básica

</a>




<a href="banda.html">

Banda transportadora

</a>




<a href="robot.html">

Robot CAD

</a>



</div>







<div id="loadBadge" class="load-badge">

Cargando...

</div>






<div class="info-badge">


XR MULTIPLATAFORMA

<br>

Laboratorio Realidad Virtual

<br>

VR + Mixed Reality

<br>

Meta Quest

</div>








<a-scene


id="scene"


stats



renderer="

alpha:true;

antialias:true;

physicallyCorrectLights:true;

colorManagement:true;

"




vr-mode-ui="enabled:true"



webxr="

referenceSpaceType:local-floor;

optionalFeatures:hit-test,dom-overlay;

"



>

<!-- CAMARA -->

<a-entity

position="0 1.6 6">


<a-camera>

</a-camera>


</a-entity>








<!-- ILUMINACION -->


<a-light

type="ambient"

color="#BBBBBB"

intensity="1.2">

</a-light>




<a-light

type="directional"

position="1 4 2"

intensity="1.1">

</a-light>








<!-- PISO -->


<a-plane


position="0 0 0"


rotation="-90 0 0"


width="24"


height="24"


color="#D8F3DC">


</a-plane>









<!-- PANEL CENTRAL -->


<a-box


position="0 2 -4"


width="7"


height="2.6"


depth="0.25"


color="#1D3557">


</a-box>








<!-- TEXTO PRINCIPAL -->


<a-text


value="XR MULTIPLATAFORMA"


position="-2.85 2.55 -3.86"


color="white"


width="8">


</a-text>







<a-text


value="Laboratorio de Realidad Virtual"


position="-2.6 1.95 -3.86"


color="#A8DADC"


width="6">


</a-text>







<a-text


value="Selecciona una escena"


position="-2.5 1.35 -3.86"


color="white"


width="5">


</a-text>









<!-- OBJETOS DECORATIVOS -->


<a-box


position="-4 1 -5"


rotation="0 25 0"


width="1.2"


height="1.2"


depth="1.2"


color="#4CC9F0"


animation="

property:rotation;

to:0 360 0;

dur:5000;

loop:true;

"

>


</a-box>







<a-cylinder


position="0 1 -6"


radius="0.6"


height="1.6"


color="#FFD166"


animation="

property:rotation;

to:360 360 0;

dur:6000;

loop:true;

"

>


</a-cylinder>







<a-sphere


position="4 1.2 -5"


radius="0.9"


color="#EF476F"


animation="

property:position;

from:4 1.2 -5;

to:4 1.8 -5;

dir:alternate;

dur:2000;

loop:true;

"

>


</a-sphere>









</a-scene>







<script>


const scene = document.querySelector("#scene");




// ENTRAR A AR

scene.addEventListener("enter-vr",()=>{


if(scene.is("ar-mode")){


scene.renderer.setClearColor(

0x000000,

0

);



}


});





// SALIR DE AR / VOLVER A VR

scene.addEventListener("exit-vr",()=>{


scene.renderer.setClearColor(

0x000000,

1

);



});



</script>






</body>


</html>
