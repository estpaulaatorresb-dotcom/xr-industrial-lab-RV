<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Home - XR Multiplataforma</title>


<!-- A-FRAME -->
<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>


<style>

body{
    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
}


/* MENU */

.nav-menu{

    position:fixed;
    top:16px;
    right:16px;
    z-index:20;

    display:flex;
    gap:10px;
}


.nav-menu a{

    text-decoration:none;

    background:rgba(0,0,0,0.8);

    color:white;

    padding:10px 14px;

    border-radius:10px;

    font-weight:bold;

}


/* TIEMPO DE CARGA */

.load-badge{

    position:fixed;

    top:70px;
    right:16px;

    z-index:20;

    background:white;

    padding:10px 15px;

    border-radius:10px;

    font-weight:bold;

}


/* INFORMACION */

.info-badge{

    position:fixed;

    bottom:20px;

    left:20px;

    z-index:20;

    background:rgba(0,0,0,0.7);

    color:white;

    padding:12px;

    border-radius:10px;

}



@media(max-width:768px){

.nav-menu{

    left:10px;
    right:10px;

    display:grid;

    grid-template-columns:1fr 1fr;

}

}



</style>



<script>

const startTime = performance.now();


window.addEventListener("load",()=>{

let tiempo = performance.now()-startTime;

document.getElementById("loadBadge").innerHTML=

"Carga inicial: "+tiempo.toFixed(2)+" ms";


});


</script>


</head>



<body>



<!-- MENU -->

<div class="nav-menu">


<a href="index.html">
Home
</a>


<a href="escena.html">
Escena básica
</a>


<a href="banda.html">
Banda transportadora
</a>


<a href="robot.html">
Robot CAD
</a>


</div>



<div id="loadBadge" class="load-badge">

Cargando...

</div>



<div class="info-badge">

Portada laboratorio XR.
Compatible con navegación WebXR.

</div>





<a-scene

    renderer="
    alpha:true;
    antialias:true;
    colorManagement:true;
    physicallyCorrectLights:true;
    "

    vr-mode-ui="enabled:true"


    webxr="
    optionalFeatures:
    local-floor,
    bounded-floor,
    hit-test,
    hand-tracking;
    ">



<!-- CAMARA -->

<a-entity
position="0 1.6 6">

<a-camera>

</a-camera>


</a-entity>





<!-- ILUMINACION -->

<a-light

type="ambient"

color="#BBB">

</a-light>



<a-light

type="directional"

intensity="1"

position="1 4 2">

</a-light>





<!-- PISO -->

<a-plane

rotation="-90 0 0"

width="20"

height="20"

color="#D8F3DC">

</a-plane>






<!-- PANEL -->

<a-box

position="0 2 -4"

width="7"

height="2.5"

depth="0.2"

color="#1D3557">

</a-box>





<!-- TEXTOS -->

<a-text

value="XR MULTIPLATAFORMA"

position="-2.8 2.5 -3.85"

color="white"

width="7">

</a-text>



<a-text

value="Laboratorio de Realidad Virtual"

position="-2.6 2 -3.85"

color="#A8DADC"

width="6">

</a-text>


<a-text

value="Selecciona una escena"

position="-2.3 1.5 -3.85"

color="white"

width="5">

</a-text>







<!-- OBJETOS -->

<a-box

position="-4 1 -5"

width="1.2"

height="1.2"

depth="1.2"

color="#4CC9F0">

</a-box>




<a-cylinder

position="0 1 -6"

radius="0.6"

height="1.5"

color="#FFD166">

</a-cylinder>



<a-sphere

position="4 1 -5"

radius="0.9"

color="#EF476F">

</a-sphere>





<!-- FONDO TRANSPARENTE PARA MR -->

<a-sky

color="transparent">

</a-sky>




</a-scene>



</body>

</html>
