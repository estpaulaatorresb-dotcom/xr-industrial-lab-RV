<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Home - XR Multiplataforma</title>


<!-- A-FRAME -->
<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>


<script>

const inicio = performance.now();



/* ===========================
   BOTON AR
=========================== */


async function entrarAR(){

    if(!navigator.xr){

        alert("Este navegador no soporta WebXR");
        return;

    }


    const disponible =
    await navigator.xr.isSessionSupported(
        "immersive-ar"
    );


    if(!disponible){

        alert(
        "AR no disponible en este dispositivo"
        );

        return;

    }


    try{


        const session =
        await navigator.xr.requestSession(
            "immersive-ar",
            {

            requiredFeatures:[
                "local-floor"
            ],

            optionalFeatures:[
                "hit-test",
                "bounded-floor"
            ]

            }
        );


        console.log(
        "Sesión AR iniciada",
        session
        );


    }

    catch(error){

        console.log(error);

        alert(
        "Error iniciando AR"
        );

    }

}




/* ===========================
   INFORMACION XR
=========================== */


window.addEventListener(
"load",

async()=>{


let tiempo =
performance.now()-inicio;



document.getElementById(
"carga"
).innerHTML =

"Carga inicial: "
+
tiempo.toFixed(2)
+
" ms";



if(navigator.xr){


let vr =
await navigator.xr.isSessionSupported(
"immersive-vr"
);



let ar =
await navigator.xr.isSessionSupported(
"immersive-ar"
);



document.getElementById(
"estadoXR"
).innerHTML =

"VR: "
+
(vr?"Disponible":"No disponible")
+
"<br>"
+
"AR: "
+
(ar?"Disponible":"No disponible");



}

else{


document.getElementById(
"estadoXR"
).innerHTML =

"WebXR no disponible";


}


});





/* ===========================
 FPS
=========================== */


setInterval(()=>{


let escena =
document.querySelector(
"a-scene"
);



if(
escena &&
escena.renderer
){


document.getElementById(
"fps"
).innerHTML =

"FPS activos";


}


},1000);



</script>




<style>


body{

margin:0;

overflow:hidden;

font-family:Arial;

}



/* MENU */

.menu{


position:fixed;

top:15px;

right:15px;

z-index:30;

display:flex;

gap:10px;

}



.menu a,
.menu button{


background:#222;

color:white;

border:none;

padding:12px 16px;

border-radius:10px;

font-weight:bold;

text-decoration:none;

cursor:pointer;


}



.menu button:hover,
.menu a:hover{


background:#444;


}





/* CARGA */


#carga{


position:fixed;

top:80px;

right:15px;

background:white;

padding:12px;

border-radius:10px;

z-index:30;

font-weight:bold;


}





/* PANEL INFO */


.info{


position:fixed;

bottom:20px;

left:20px;

background:
rgba(0,0,0,0.75);

color:white;

padding:15px;

border-radius:10px;

z-index:30;


}





@media(max-width:700px){


.menu{


left:10px;

right:10px;

display:grid;

grid-template-columns:1fr 1fr;


}


}



</style>


</head>




<body>

<div class="menu">

Home
