<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XR Multiplataforma - Home</title>


<script>

const startTime = performance.now();

</script>


<script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>



<style>


body{

margin:0;

overflow:hidden;

font-family:Arial,sans-serif;

}




.nav-menu{


position:fixed;

top:16px;

right:16px;

z-index:20;


display:flex;

flex-wrap:wrap;

gap:10px;


}



.nav-menu a,
.nav-menu button{


text-decoration:none;

background:rgba(0,0,0,0.78);

color:white;


padding:10px 14px;

border-radius:10px;


font-size:14px;

font-weight:600;


border:none;

cursor:pointer;


}



.nav-menu a:hover,
.nav-menu button:hover{


background:rgba(0,0,0,0.95);


}




.load-badge{


position:fixed;

top:68px;

right:16px;


z-index:20;


background:white;

color:#111;


padding:10px 14px;


border-radius:10px;


font-weight:bold;


}





.info-badge{


position:fixed;

bottom:16px;

left:16px;


z-index:20;


background:rgba(0,0,0,0.72);


color:white;


padding:10px 14px;


border-radius:10px;


max-width:380px;


font-size:13px;


}



@media(max-width:768px){


.nav-menu{


left:12px;

right:12px;

top:12px;


display:grid;

grid-template-columns:1fr 1fr;


}



.nav-menu a,
.nav-menu button{


font-size:12px;

text-align:center;


}



.info-badge{


left:12px;

right:12px;


bottom:90px;


max-width:none;


}



}



</style>



<script>


window.addEventListener('load',()=>{


let tiempo =
performance.now()-startTime;


document.getElementById("loadBadge").innerHTML =

"Carga inicial: "

+ tiempo.toFixed(2)

+ " ms";


});



</script>


</head>



<body>



<div class="nav-menu">


<a href="index.html">
Home
</a>


<a href="escena.html">
Escena básica
</a>


<a href="banda.html">
Banda transportadora
</a>


<a href="robot.html">
Robot CAD
</a>


<button id="arButton">
AR Meta Quest
</button>



</div>



<div id="loadBadge" class="load-badge">

Cargando...

</div>



<div class="info-badge">

Portada del laboratorio XR.
Usa el menú para navegar entre las experiencias.

</div>



<a-scene

xr-mode="immersive-ar"

webxr="requiredFeatures: local-floor; optionalFeatures: hit-test, dom-overlay;"

vr-mode-ui="enabled:true"

renderer="colorManagement:true"

stats

>
