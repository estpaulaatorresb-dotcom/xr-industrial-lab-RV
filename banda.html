<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Banda Transportadora XR</title>


<script>
const startTime = performance.now();
</script>


<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>



<style>


body{

margin:0;

overflow:hidden;

font-family:Arial,sans-serif;

}


/* MENU */

.nav-menu{

position:fixed;

top:16px;

right:16px;

z-index:20;

display:flex;

gap:10px;

flex-wrap:wrap;

}


.nav-menu a{

background:rgba(0,0,0,0.8);

color:white;

padding:10px 14px;

border-radius:10px;

text-decoration:none;

font-weight:bold;

}


.nav-menu a:hover{

background:black;

}



/* LATENCIA */

.load-badge{

position:fixed;

top:70px;

right:16px;

z-index:20;

background:white;

padding:10px 14px;

border-radius:10px;

font-weight:bold;

}




/* INFORMACION */

.info-badge{

position:fixed;

bottom:16px;

left:16px;

z-index:20;

background:rgba(0,0,0,0.75);

color:white;

padding:12px;

border-radius:10px;

max-width:350px;

}





@media(max-width:700px){


.nav-menu{

top:12px;

left:12px;

right:12px;

display:grid;

grid-template-columns:1fr 1fr;

}


.nav-menu a{

font-size:12px;

text-align:center;

}


}



</style>




<script>


window.addEventListener("load",()=>{


let tiempo = performance.now()-startTime;


document.getElementById("loadBadge").innerHTML =

"Carga inicial: "

+

tiempo.toFixed(2)

+

" ms";


});


</script>



</head>





<body>



<div class="nav-menu">


<a href="index.html">
Home
</a>


<a href="escena.html">
Escena básica
</a>


<a href="banda.html">
Banda transportadora
</a>


<a href="robot.html">
Robot CAD
</a>


</div>





<div id="loadBadge" class="load-badge">

Cargando...

</div>





<div class="info-badge">


Banda transportadora XR

<br>

Sistema industrial virtual

<br>

VR + Mixed Reality Meta Quest


</div>







<a-scene


id="scene"


stats



renderer="

alpha:true;

antialias:true;

physicallyCorrectLights:true;

colorManagement:true;

"



vr-mode-ui="enabled:true"



webxr="

referenceSpaceType:local-floor;

optionalFeatures:hit-test,dom-overlay;

"



>





<!-- CAMARA -->


<a-entity

position="0 1.6 6">


<a-camera>

</a-camera>


</a-entity>






<!-- ILUMINACION -->


<a-light

type="ambient"

color="#BBBBBB"

intensity="1.2">

</a-light>




<a-light

type="directional"

position="1 4 2"

intensity="1.2">

</a-light>





<!-- PISO -->


<a-plane


position="0 0 0"


rotation="-90 0 0"


width="15"


height="15"


color="#D8F3DC">


</a-plane>





<!-- BASE BANDA -->


<a-box


position="0 0.25 -3"


width="8"


height="0.5"


depth="2"


color="#444444">


</a-box>





<!-- SUPERFICIE MOVIL -->


<a-box


position="0 0.55 -3"


width="7"


height="0.12"


depth="1.5"


color="#222222"


animation="

property:position;

from:0 0.55 -3;

to:0 0.55 -2.5;

dir:alternate;

dur:3000;

loop:true;

"

>


</a-box>

<!-- RODILLO IZQUIERDO -->

<a-cylinder

position="-3.5 0.65 -3"

rotation="0 0 90"

radius="0.35"

height="1.7"

color="#888888">

</a-cylinder>




<!-- RODILLO DERECHO -->

<a-cylinder

position="3.5 0.65 -3"

rotation="0 0 90"

radius="0.35"

height="1.7"

color="#888888">

</a-cylinder>






<!-- BOTELLA 1 -->

<a-cylinder

id="botella1"

position="-2 1 -3"

radius="0.25"

height="0.8"

color="#4CC3D9"

animation="

property:position;

from:-2 1 -3;

to:2 1 -3;

dur:6000;

loop:true;

easing:linear;

"

>

</a-cylinder>







<!-- BOTELLA 2 -->

<a-cylinder

id="botella2"

position="0 1 -3"

radius="0.25"

height="0.8"

color="#EF476F"

animation="

property:position;

from:0 1 -3;

to:4 1 -3;

dur:6000;

loop:true;

easing:linear;

"

>

</a-cylinder>







<!-- BOTELLA 3 -->

<a-cylinder

id="botella3"

position="2 1 -3"

radius="0.25"

height="0.8"

color="#FFD166"

animation="

property:position;

from:2 1 -3;

to:6 1 -3;

dur:6000;

loop:true;

easing:linear;

"

>

</a-cylinder>







<!-- TEXTO -->

<a-text

value="BANDA TRANSPORTADORA XR"

position="-2.8 2.5 -3"

color="white"

width="6">

</a-text>








</a-scene>






<script>


// ======================================
// CONFIGURACION AR META QUEST
// ======================================


const scene = document.querySelector("#scene");



scene.addEventListener("enter-vr",()=>{


if(scene.is("ar-mode")){


// Fondo transparente

scene.renderer.setClearColor(

0x000000,

0

);



}

});





scene.addEventListener("exit-vr",()=>{


scene.renderer.setClearColor(

0x000000,

1

);



});



</script>






</body>

</html>
