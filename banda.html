<script>

const startTime = performance.now();


window.addEventListener("load",()=>{


let tiempo = performance.now()-startTime;

<a-scene


stats


renderer="

alpha:true;

antialias:true;

colorManagement:true

"


vr-mode-ui="enabled:true"



webxr="

optionalFeatures:

local-floor,

bounded-floor,

hit-test

"


>







<!-- CAMARA -->


<a-entity position="0 1.6 6">


<a-camera>

</a-camera>


</a-entity>







<!-- ILUMINACION -->


<a-light

type="ambient"

color="#BBBBBB">

</a-light>




<a-light

type="directional"

position="1 4 2"

intensity="1.2">

</a-light>







<!-- BASE -->



<a-box


position="0 0.25 -3"


width="8"


height="0.5"


depth="2"


color="#444444"


>


</a-box>








<!-- BANDA MOVIL -->


<a-box


position="0 0.55 -3"


width="7"


height="0.12"


depth="1.5"


color="#222222"


animation="

property:position;

to:0 0.55 -2.5;

dir:alternate;

dur:3000;

loop:true

"


>

</a-box>








<!-- RODILLOS -->


<a-cylinder


position="-3.5 0.65 -3"


rotation="0 0 90"


radius="0.35"


height="1.7"


color="#888888"


>

</a-cylinder>



<a-cylinder


position="3.5 0.65 -3"


rotation="0 0 90"


radius="0.35"


height="1.7"


color="#888888"


>

</a-cylinder>








<!-- BOTELLAS -->



<a-cylinder


position="-2 1 -3"


radius="0.25"


height="0.8"


color="#4CC3D9"


animation="

property:position;

to:2 1 -3;

dur:6000;

loop:true

"


>

</a-cylinder>







<a-cylinder


position="0 1 -3"


radius="0.25"


height="0.8"


color="#EF476F"


animation="

property:position;

to:4 1 -3;

dur:6000;

loop:true

"


>

</a-cylinder>







<a-cylinder


position="2 1 -3"


radius="0.25"


height="0.8"


color="#FFD166"


animation="

property:position;

to:6 1 -3;

dur:6000;

loop:true

"


>

</a-cylinder>








<!-- TEXTO -->


<a-text


value="BANDA TRANSPORTADORA XR"

>

</a-text>
