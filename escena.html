<!DOCTYPE html>

<html lang="es">

<head>


<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Escena básica XR</title>



<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>



<script>


const inicio = performance.now();



window.addEventListener(
"load",
()=>{


let tiempo =
performance.now()-inicio;


document.getElementById(
"latencia"
).innerHTML =


"Carga inicial: "
+
tiempo.toFixed(2)
+
" ms";


});



</script>






<style>



body{

margin:0;

overflow:hidden;

font-family:Arial;

}





.menu{


position:fixed;

top:15px;

right:15px;

z-index:20;


display:flex;

gap:10px;

flex-wrap:wrap;


}





.menu a{


background:#222;

color:white;

padding:12px 15px;

border-radius:10px;

text-decoration:none;

font-weight:bold;


}





.menu a:hover{


background:#555;


}





#latencia{


position:fixed;

right:20px;

top:80px;

background:white;

padding:12px;

border-radius:10px;

font-weight:bold;

z-index:20;


}





.info{


position:fixed;

bottom:20px;

left:20px;


background:rgba(0,0,0,.75);

color:white;


padding:15px;

border-radius:10px;


z-index:20;


}





</style>


</head>







<body>




<div class="menu">


<a href="index.html">
Home
</a>


<a href="escena.html">
Escena básica
</a>


<a href="banda.html">
Banda transportadora
</a>


<a href="robot.html">
Robot CAD
</a>


<a href="ar.html">
AR Celular
</a>


</div>





<div id="latencia">

Cargando...

</div>





<div class="info">


Escena básica XR

<br>

Objetos primitivos A-Frame

<br>

Compatible con WebXR VR


</div>









<a-scene


stats


renderer="

alpha:true;

antialias:true;

colorManagement:true;

"



vr-mode-ui="enabled:true"



webxr="

optionalFeatures:

local-floor,

bounded-floor

"


>







<!-- CAMARA -->


<a-camera

position="0 1.6 6">

</a-camera>








<!-- ILUMINACION -->


<a-light

type="ambient"

color="#BBBBBB">

</a-light>




<a-light

type="directional"

position="1 4 2"

intensity="1">

</a-light>







<!-- SUELO -->


<a-plane


rotation="-90 0 0"


width="20"


height="20"


color="#7BC8A4"


>

</a-plane>










<!-- CUBO -->


<a-box


position="0 1 -3"


rotation="0 45 0"


width="1.5"


height="1.5"


depth="1.5"


color="#4CC3D9"


animation="

property:rotation;

to:0 405 0;

dur:5000;

loop:true

"


>

</a-box>









<!-- ESFERA -->


<a-sphere


position="2 1 -4"


radius="1"


color="#EF2D5E"


animation="

property:position;

dir:alternate;

to:2 1.5 -4;

dur:2000;

loop:true

"


>

</a-sphere>









<!-- CILINDRO -->


<a-cylinder


position="-2 1 -4"


radius="0.6"


height="1.8"


color="#FFC65D"


animation="

property:rotation;

to:0 360 0;

dur:4000;

loop:true

"


>

</a-cylinder>









<!-- TITULO -->


<a-text


value="Escena basica XR"


position="-2 2.8 -3"


width="5"


color="black"


>

</a-text>









<!-- FONDO TRANSPARENTE -->


<a-sky

color="transparent">

</a-sky>







</a-scene>






</body>

</html>
