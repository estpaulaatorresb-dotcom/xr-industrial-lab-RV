<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>XR Multiplataforma - WebXR</title>


<!-- A-FRAME -->

<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>


<style>


body{

margin:0;

font-family:Arial,sans-serif;

overflow:hidden;

}



/* MENU */

.nav-menu{

position:fixed;

top:15px;

right:15px;

z-index:20;

display:flex;

gap:10px;

}



.nav-menu a{

background:#222;

color:white;

padding:12px 18px;

border-radius:10px;

text-decoration:none;

font-weight:bold;

}


.nav-menu a:hover{

background:#444;

}



/* BOTONES XR */


.xr-buttons{

position:fixed;

bottom:20px;

left:50%;

transform:translateX(-50%);

z-index:30;

display:flex;

gap:15px;

}



.xr-buttons button{


padding:15px 25px;

border:none;

border-radius:12px;

background:#1d3557;

color:white;

font-size:16px;

font-weight:bold;

cursor:pointer;


}



.xr-buttons button:hover{

background:#457b9d;

}



/* INFORMACION */


.info{


position:fixed;

bottom:20px;

left:20px;

background:rgba(0,0,0,0.7);

color:white;

padding:15px;

border-radius:10px;

z-index:20;

max-width:350px;


}



</style>


</head>




<body>



<!-- MENU NAVEGACION -->

<div class="nav-menu">


<a href="index.html">

Home

</a>


<a href="escena.html">

Escena básica

</a>


<a href="banda.html">

Banda transportadora

</a>


<a href="robot.html">

Robot CAD

</a>


</div>





<!-- BOTONES VR AR -->


<div class="xr-buttons">


<button onclick="entrarVR()">

🥽 Entrar VR

</button>



<button onclick="entrarAR()">

📷 Entrar AR

</button>


</div>





<div class="info">


XR Multiplataforma<br>

Compatible con navegador y Meta Quest.<br>

VR + Mixed Reality WebXR


</div>







<a-scene

id="scene"

stats

vr-mode-ui="enabled:true"

webxr="optionalFeatures: local-floor, hit-test;"

embedded>



<!-- CAMARA -->


<a-camera

position="0 1.6 6">

</a-camera>





<!-- ILUMINACION -->


<a-light

type="ambient"

color="#BBB">

</a-light>



<a-light

type="directional"

color="#FFF"

intensity="1"

position="2 4 2">

</a-light>







<!-- PISO -->


<a-plane


rotation="-90 0 0"


width="30"


height="30"


color="#D8F3DC">


</a-plane>







<!-- PANEL CENTRAL -->


<a-box


position="0 2 -4"


width="7"


height="2.5"


depth="0.25"


color="#1D3557">


</a-box>





<a-text


value="XR MULTIPLATAFORMA"


position="-3 2.5 -3.8"


color="white"


width="8">


</a-text>





<a-text


value="Laboratorio Realidad Virtual"


position="-2.7 2 -3.8"


color="#A8DADC"


width="6">


</a-text>







<!-- OBJETOS 3D -->


<a-box


position="-4 1 -5"


width="1.2"

height="1.2"

depth="1.2"

rotation="0 45 0"

color="#4CC9F0">


</a-box>







<a-cylinder


position="0 1 -6"


radius="0.6"


height="1.5"


color="#FFD166">


</a-cylinder>








<a-sphere


position="4 1 -5"


radius="0.9"


color="#EF476F">


</a-sphere>








<!-- ROBOT -->

<a-entity


gltf-model="models/robotassembly.glb"


position="0 0 -8"


scale="0.5 0.5 0.5">


</a-entity>






<a-sky color="#ECECEC">


</a-sky>





</a-scene>








<script>


let scene=document.querySelector("#scene");




// ENTRAR VR


function entrarVR(){


scene.enterVR();


}






// ENTRAR AR


async function entrarAR(){



if(scene.xrSession){


return;

}



try{


let session = await navigator.xr.requestSession(

"immersive-ar",

{

requiredFeatures:[

"hit-test"

]

}

);



scene.renderer.xr.setSession(session);



}


catch(error){


alert(

"No se pudo iniciar AR. Verifique compatibilidad WebXR"

);


}



}



</script>







</body>


</html>
