<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Escena básica XR</title>


<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>



<script>

const startTime = performance.now();


window.addEventListener("load",()=>{

let tiempo = performance.now()-startTime;

document.getElementById("loadBadge").innerHTML =
"Carga inicial: " + tiempo.toFixed(2) + " ms";


});


</script>




<style>


body{

margin:0;

overflow:hidden;

font-family:Arial,sans-serif;

}



.nav-menu{


position:fixed;

top:16px;

right:16px;

z-index:20;

display:flex;

gap:10px;

flex-wrap:wrap;


}



.nav-menu a{


background:rgba(0,0,0,0.8);

color:white;

padding:10px 14px;

border-radius:10px;

text-decoration:none;

font-weight:bold;


}



.nav-menu a:hover{

background:black;

}




.load-badge{


position:fixed;

top:75px;

right:16px;

z-index:20;

background:white;

padding:10px;

border-radius:10px;

font-weight:bold;


}




.info-badge{


position:fixed;

bottom:20px;

left:20px;

z-index:20;

background:rgba(0,0,0,0.75);

color:white;

padding:15px;

border-radius:10px;


}




@media(max-width:700px){


.nav-menu{

left:10px;

right:10px;

display:grid;

grid-template-columns:1fr 1fr;


}



.nav-menu a{

font-size:12px;

text-align:center;


}


}



</style>


</head>




<body>



<div class="nav-menu">

</div>





<div id="loadBadge" class="load-badge">

Cargando...

</div>






<div class="info-badge">


Escena básica XR

<br>

Primitivas 3D A-Frame

<br>

VR + Mixed Reality


</div>







<a-scene


stats


renderer="

alpha:true;

antialias:true;

colorManagement:true

"


vr-mode-ui="enabled:true"



webxr="

optionalFeatures:

local-floor,

bounded-floor,

hit-test

"


>







<!-- CAMARA -->


<a-entity position="0 1.6 6">

<a-camera>

</a-camera>


</a-entity>







<!-- LUCES -->


<a-light

type="ambient"

color="#BBBBBB">

</a-light>



<a-light

type="directional"

position="1 4 2"

intensity="1.2">

</a-light>







<!-- CUBO -->


<a-box


position="0 1 -3"


rotation="0 45 0"


color="#4CC3D9"


animation="

property:rotation;

to:360 405 360;

dur:6000;

loop:true

"


>

</a-box>







<!-- ESFERA -->


<a-sphere


position="2 1 -4"


radius="1"


color="#EF2D5E"


animation="

property:position;

to:2 1.8 -4;

dir:alternate;

dur:2000;

loop:true

"

>

</a-sphere>







<!-- CILINDRO -->


<a-cylinder


position="-2 1 -4"


radius="0.5"


height="1.5"


color="#FFC65D"


animation="

property:rotation;

to:360 360 0;

dur:5000;

loop:true

"


>

</a-cylinder>







<!-- PLANO -->


<a-plane


rotation="-90 0 0"


width="10"


height="10"


color="#7BC8A4"


>

</a-plane>







<!-- TEXTO -->


<a-text


value="ESCENA BASICA XR"


position="-1.8 2.7 -3"


color="black"


width="5"


>

</a-text>







<!-- FONDO TRANSPARENTE AR -->


<a-sky

color="transparent">

</a-sky>




</a-scene>






</body>


</html>
