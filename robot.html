<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Robot CAD - XR Multiplataforma</title>


<script>
const startTime = performance.now();
</script>


<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>



<style>


body{

margin:0;

overflow:hidden;

font-family:Arial,sans-serif;

}



/* MENU */

.nav-menu{

position:fixed;

top:16px;

right:16px;

z-index:20;

display:flex;

gap:10px;

flex-wrap:wrap;

}



.nav-menu a{

background:rgba(0,0,0,0.8);

color:white;

padding:10px 14px;

border-radius:10px;

text-decoration:none;

font-weight:bold;

}



.nav-menu a:hover{

background:black;

}





.load-badge{

position:fixed;

top:70px;

right:16px;

z-index:20;

background:white;

padding:10px 14px;

border-radius:10px;

font-weight:bold;

}





.info-badge{

position:fixed;

bottom:16px;

left:16px;

z-index:20;

background:rgba(0,0,0,0.75);

color:white;

padding:12px;

border-radius:10px;

max-width:380px;

}





@media(max-width:768px){


.nav-menu{

top:12px;

left:12px;

right:12px;

display:grid;

grid-template-columns:1fr 1fr;

}



.nav-menu a{

text-align:center;

font-size:12px;

}


}



</style>



<script>


window.addEventListener("load",()=>{


let tiempo = performance.now()-startTime;


document.getElementById("loadBadge").innerHTML =

"Carga inicial: "

+

tiempo.toFixed(2)

+

" ms";


});



</script>


</head>




<body>




<div class="nav-menu">


<a href="index.html">
Home
</a>


<a href="escena.html">
Escena básica
</a>


<a href="banda.html">
Banda transportadora
</a>


<a href="robot.html">
Robot CAD
</a>


</div>







<div id="loadBadge" class="load-badge">

Cargando...

</div>







<div class="info-badge">


Robot CAD Industrial XR

<br>

Modelo GLB exportado desde SolidWorks

<br>

VR + Mixed Reality Meta Quest


</div>








<a-scene


id="scene"


stats


renderer="

alpha:true;

antialias:true;

physicallyCorrectLights:true;

colorManagement:true;

"



vr-mode-ui="enabled:true"



webxr="

referenceSpaceType:local-floor;

optionalFeatures:hit-test,dom-overlay;

"

>






<a-assets>


<a-asset-item

id="modeloRobot"

src="models/robotassembly.glb">

</a-asset-item>


</a-assets>








<!-- CAMARA -->

<a-entity

position="0 1.6 4">


<a-camera>

</a-camera>


</a-entity>







<!-- LUCES -->


<a-light

type="ambient"

color="#D9D9D9"

intensity="1.15">

</a-light>



<a-light

type="directional"

color="#FFFFFF"

intensity="1.25"

position="2 5 3">

</a-light>



<a-light

type="directional"

color="#FFFFFF"

intensity="0.65"

position="-3 4 2">

</a-light>



<a-light

type="point"

color="#A8DADC"

intensity="0.35"

position="0 3 -2">

</a-light>








<!-- PISO -->


<a-plane


position="0 0 0"


rotation="-90 0 0"


width="18"


height="18"


color="#D8F3DC">


</a-plane>








<!-- FONDO SOLO VR -->

<a-plane


id="fondoVR"


position="0 4.5 -8"


width="18"


height="10"


color="#ECECEC">


</a-plane>









<!-- PLATAFORMA -->


<a-cylinder


position="0 0.15 -1.9"


radius="1.2"


height="0.25"


color="#6C757D">


</a-cylinder>




<a-cylinder


position="0 0.30 -1.9"


radius="0.95"


height="0.08"


color="#ADB5BD">


</a-cylinder>









<!-- ROBOT -->


<a-entity


id="robot"


position="0 0.34 -1.7"


rotation="0 -25 0"


scale="0.8 0.8 0.8"


animation="

property:rotation;

from:0 -25 0;

to:0 335 0;

loop:true;

dur:16000;

easing:linear;

"

>


<a-entity


gltf-model="#modeloRobot"


>

</a-entity>


</a-entity>










<!-- TEXTO -->


<a-text


value="Brazo robotico industrial CAD"


position="-2.35 3.45 -2"


color="#1F1F1F"


width="7">


</a-text>









<!-- DECORACION -->


<a-box


position="-3.8 0.8 -3.4"


width="0.8"


height="1.6"


depth="0.8"


color="#4CC9F0">


</a-box>




<a-cylinder


position="3.8 0.8 -3.4"


radius="0.4"


height="1.6"


color="#FFD166">


</a-cylinder>






</a-scene>









<script>


const scene =
document.querySelector("#scene");


const fondo =
document.querySelector("#fondoVR");



scene.addEventListener(
"enter-vr",
()=>{


if(scene.is("ar-mode")){


fondo.setAttribute(
"visible",
false
);



scene.renderer.setClearColor(
0x000000,
0
);


}



});




scene.addEventListener(
"exit-vr",
()=>{


fondo.setAttribute(
"visible",
true
);


scene.renderer.setClearColor(
0x000000,
1
);



});



</script>





</body>

</html>
