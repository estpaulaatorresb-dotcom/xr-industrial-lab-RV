<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>



<script>

const startTime = performance.now();


window.addEventListener("load",()=>{


let tiempo = performance.now()-startTime;


document.getElementById("loadBadge").innerHTML =

"Carga inicial: " + tiempo.toFixed(2) + " ms";


});

</script>



<style>


body{

margin:0;

overflow:hidden;

font-family:Arial,sans-serif;

}



.nav-menu{


position:fixed;

top:16px;

right:16px;

z-index:20;

display:flex;

gap:10px;

flex-wrap:wrap;


}



.nav-menu a{


background:rgba(0,0,0,0.8);

color:white;

padding:10px 14px;

border-radius:10px;

text-decoration:none;

font-weight:bold;


}



.nav-menu a:hover{

background:black;

}



.load-badge{


position:fixed;

top:75px;

right:16px;

z-index:20;

background:white;

padding:10px;

border-radius:10px;

font-weight:bold;


}




.info-badge{


position:fixed;

bottom:20px;

left:20px;

z-index:20;

background:rgba(0,0,0,0.75);

color:white;

padding:15px;

border-radius:10px;


}



@media(max-width:700px){


.nav-menu{


left:10px;

right:10px;

display:grid;

grid-template-columns:1fr 1fr;


}



.nav-menu a{

font-size:12px;

text-align:center;

}


}


</style>


</head>




<body>




<div class="nav-menu">

</div>






<div id="loadBadge" class="load-badge">

Cargando...

</div>







<div class="info-badge">


Robot CAD XR

<br>

Modelo 3D industrial

<br>

VR + Mixed Reality


</div>







<a-scene


stats


renderer="

alpha:true;

antialias:true;

colorManagement:true

"


vr-mode-ui="enabled:true"



webxr="

optionalFeatures:

local-floor,

bounded-floor,

hit-test

"


>








<!-- CAMARA -->


<a-entity position="0 1.6 5">


<a-camera>

</a-camera>


</a-entity>








<!-- LUCES -->


<a-light

type="ambient"

color="#BBBBBB">

</a-light>




<a-light

type="directional"

position="2 4 2"

intensity="1.2">

</a-light>








<!-- MODELO ROBOT -->



<a-entity


gltf-model="models/robotassembly.glb"


position="0 0 -3"


scale="0.8 0.8 0.8"


animation="

property:rotation;

to:0 360 0;

dur:10000;

loop:true

"


>

</a-entity>









<!-- BASE DEL ROBOT -->


<a-cylinder


position="0 0 -3"


radius="1.5"


height="0.2"


color="#555555"


>

</a-cylinder>









<!-- TEXTO -->


<a-text


value="ROBOT CAD XR"


position="-1.8 2.5 -3"


color="white"


width="5"


>

</a-text>








<!-- PISO -->


<a-plane


rotation="-90 0 0"


width="15"


height="15"


color="#D8F3DC"


>

</a-plane>









<!-- FONDO TRANSPARENTE AR -->


<a-sky

color="transparent">

</a-sky>






</a-scene>






</body>


</html>
