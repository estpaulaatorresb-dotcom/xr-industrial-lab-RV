<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Robot CAD XR</title>


<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>



<style>


body{

margin:0;

font-family:Arial,sans-serif;

overflow:hidden;

}



/* MENU */

.nav-menu{

position:fixed;

top:15px;

right:15px;

z-index:20;

display:flex;

gap:10px;

}


.nav-menu a{


background:#222;

color:white;

padding:12px 18px;

border-radius:10px;

text-decoration:none;

font-weight:bold;

}



.nav-menu a:hover{

background:#444;

}



/* BOTONES XR */

.xr-buttons{


position:fixed;

bottom:20px;

left:50%;

transform:translateX(-50%);

z-index:30;

display:flex;

gap:15px;

}



.xr-buttons button{


padding:15px 25px;

border:none;

border-radius:12px;

background:#1d3557;

color:white;

font-size:16px;

font-weight:bold;

cursor:pointer;

}



.xr-buttons button:hover{

background:#457b9d;

}





.info{


position:fixed;

bottom:20px;

left:20px;

background:rgba(0,0,0,0.75);

color:white;

padding:15px;

border-radius:10px;

z-index:20;

max-width:350px;

}


</style>


</head>



<body>



<!-- MENU -->

<div class="nav-menu">


<a href="index.html">
Home
</a>


<a href="escena.html">
Escena básica
</a>


<a href="banda.html">
Banda transportadora
</a>


<a href="robot.html">
Robot CAD
</a>


</div>





<!-- BOTONES -->


<div class="xr-buttons">


<button onclick="entrarVR()">

🥽 VR

</button>


<button onclick="entrarAR()">

📷 AR

</button>


</div>





<div class="info">

<b>Robot CAD Industrial XR</b>

<br><br>

Modelo CAD en formato GLB.

<br><br>

Compatible con Meta Quest VR / Mixed Reality.

</div>







<a-scene


id="scene"


renderer="alpha:true; physicallyCorrectLights:true;"


vr-mode-ui="enabled:true"


webxr="optionalFeatures: hit-test, local-floor"


embedded>






<!-- CAMARA -->


<a-camera

position="0 1.6 0">

</a-camera>






<!-- ILUMINACION -->


<a-light


type="ambient"


color="#FFFFFF"


intensity="3">


</a-light>





<a-light


type="directional"


color="#FFFFFF"


position="2 4 2"


intensity="2">


</a-light>







<!-- ROBOT CAD -->


<a-entity


id="robot"


gltf-model="models/robotassembly.glb"


position="0 1 -1"


rotation="0 180 0"


scale="2 2 2">


</a-entity>






<!-- TEXTO 3D -->


<a-text


value="ROBOT CAD INDUSTRIAL"


position="-2 2.5 -3"


color="white"


width="5">


</a-text>







</a-scene>







<script>



let scene = document.querySelector("#scene");





// ======================
// VR
// ======================


function entrarVR(){


scene.enterVR();


}







// ======================
// AR / MIXED REALITY
// ======================


async function entrarAR(){


try{


let session = await navigator.xr.requestSession(

"immersive-ar",

{


requiredFeatures:[

"local-floor",

"hit-test"

]


}

);



scene.renderer.xr.setSession(session);



console.log(

"Modo AR iniciado"

);



}


catch(error){


console.error(error);



alert(

"El dispositivo no soporta WebXR AR"

);



}


}





scene.addEventListener(

"enter-vr",

()=>{


console.log(

"XR activo"

);


}

);



</script>





</body>


</html>
