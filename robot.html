<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Robot CAD XR - AR</title>


<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>


<style>


body{

margin:0;

font-family:Arial,sans-serif;

overflow:hidden;

}



/* MENU */

.nav-menu{

position:fixed;

top:15px;

right:15px;

z-index:20;

display:flex;

gap:10px;

}


.nav-menu a{

background:#222;

color:white;

padding:12px 18px;

border-radius:10px;

text-decoration:none;

font-weight:bold;

}


.nav-menu a:hover{

background:#444;

}



/* BOTONES */

.xr-buttons{


position:fixed;

bottom:20px;

left:50%;

transform:translateX(-50%);

z-index:30;

display:flex;

gap:15px;

}



.xr-buttons button{


padding:15px 25px;

border:none;

border-radius:12px;

background:#1d3557;

color:white;

font-size:16px;

font-weight:bold;

cursor:pointer;

}


.xr-buttons button:hover{

background:#457b9d;

}




.info{


position:fixed;

bottom:20px;

left:20px;

background:rgba(0,0,0,0.75);

color:white;

padding:15px;

border-radius:10px;

z-index:20;

max-width:350px;

}


</style>


</head>



<body>


<!-- MENU -->

<div class="nav-menu">

<a href="index.html">
Home
</a>


<a href="escena.html">
Escena básica
</a>


<a href="banda.html">
Banda transportadora
</a>


<a href="robot.html">
Robot CAD
</a>


</div>



<!-- BOTONES XR -->

<div class="xr-buttons">


<button onclick="entrarVR()">

🥽 VR

</button>



<button onclick="entrarAR()">

📷 AR

</button>


</div>




<div class="info">

<b>Robot CAD Industrial XR</b>

<br><br>

Modelo GLB integrado con WebXR.

<br><br>

Modo VR y Mixed Reality para Meta Quest.

</div>





<a-scene

id="scene"

renderer="alpha:true"

vr-mode-ui="enabled:true"

webxr="optionalFeatures: hit-test, local-floor"

embedded>



<!-- CAMARA -->

<a-camera

position="0 1.6 0">

</a-camera>




<!-- LUCES -->


<a-light

type="ambient"

intensity="1">

</a-light>



<a-light

type="directional"

position="2 4 2"

intensity="1.5">

</a-light>





<!-- MODELO ROBOT -->


<a-entity

id="robot"

gltf-model="models/robotassembly.glb"

position="0 0 -2"

rotation="0 180 0"

scale="0.8 0.8 0.8">


</a-entity>





<!-- MARCADOR VISUAL -->

<a-ring

id="marker"

rotation="-90 0 0"

radius-inner="0.25"

radius-outer="0.35"

color="#00FF00"

visible="false">


</a-ring>





<!-- TEXTO -->


<a-text

value="ROBOT CAD INDUSTRIAL"

position="-2 2 -3"

color="white"

width="5">


</a-text>




</a-scene>







<script>


let scene=document.querySelector("#scene");


let robot=document.querySelector("#robot");


let marker=document.querySelector("#marker");





// =====================
// ENTRAR VR
// =====================


function entrarVR(){


scene.enterVR();


}





// =====================
// ENTRAR AR
// =====================


async function entrarAR(){


try{


let session = await navigator.xr.requestSession(

"immersive-ar",

{

requiredFeatures:[

"hit-test",

"local-floor"

]

}

);



scene.renderer.xr.setSession(session);



console.log("AR iniciado");


}


catch(error){


console.log(error);


alert(

"No se pudo iniciar AR. Verifique compatibilidad WebXR."

);


}



}





// =====================
// COLOCACION AR
// =====================


scene.addEventListener(

"enter-vr",

()=>{


console.log(

"Modo XR activo"

);


}

);




</script>



</body>

</html>
