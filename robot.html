<!DOCTYPE html>

<html lang="es">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Robot CAD XR</title>



<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>



<style>


body{

margin:0;

font-family:Arial,sans-serif;

overflow:hidden;

}





/* MENU */


.nav-menu{


position:fixed;

top:15px;

right:15px;

z-index:20;

display:flex;

gap:10px;


}




.nav-menu a{


background:#222;


color:white;


padding:12px 18px;


border-radius:10px;


text-decoration:none;


font-weight:bold;


}



.nav-menu a:hover{


background:#444;


}





/* BOTONES XR */


.xr-buttons{


position:fixed;


bottom:20px;


left:50%;


transform:translateX(-50%);


z-index:30;


display:flex;


gap:15px;


}




.xr-buttons button{


padding:15px 25px;


border:none;


border-radius:12px;


background:#1d3557;


color:white;


font-size:16px;


font-weight:bold;


cursor:pointer;


}




.xr-buttons button:hover{


background:#457b9d;


}





.info{


position:fixed;


bottom:20px;


left:20px;


background:rgba(0,0,0,0.75);


color:white;


padding:15px;


border-radius:10px;


z-index:20;


max-width:350px;


}



</style>



</head>






<body>





<!-- MENU -->


<div class="nav-menu">


<a href="index.html">

Home

</a>



<a href="escena.html">

Escena básica

</a>



<a href="banda.html">

Banda transportadora

</a>



<a href="robot.html">

Robot CAD

</a>



</div>








<!-- BOTONES XR -->


<div class="xr-buttons">


<button onclick="entrarVR()">

🥽 Entrar VR

</button>



<button onclick="entrarAR()">

📷 Entrar AR

</button>



</div>








<div class="info">


Robot CAD industrial XR


<br><br>


Modelo 3D importado en formato GLB.


<br>


Compatible con Meta Quest mediante WebXR.


</div>









<a-scene


id="scene"


stats


vr-mode-ui="enabled:true"


webxr="optionalFeatures: local-floor, hit-test;"


embedded>









<!-- CAMARA -->


<a-camera


position="0 2 8">


</a-camera>







<!-- ILUMINACION -->


<a-light


type="ambient"


color="#BBBBBB">


</a-light>




<a-light


type="directional"


color="#FFFFFF"


intensity="1.5"


position="3 5 3">


</a-light>









<!-- PISO INDUSTRIAL -->


<a-plane


rotation="-90 0 0"


width="30"


height="30"


color="#CCCCCC">


</a-plane>









<!-- MODELO ROBOT CAD -->


<a-entity


gltf-model="models/robotassembly.glb"


position="0 0 -4"


rotation="0 180 0"


scale="0.8 0.8 0.8">


</a-entity>









<!-- TITULO -->


<a-text


value="ROBOT CAD INDUSTRIAL"


position="-2.5 3 -4"


color="black"


width="6">


</a-text>









<!-- REFERENCIA VISUAL -->


<a-box


position="-4 0.5 -5"


width="1"


height="1"


depth="1"


color="#4CC9F0">


</a-box>





<a-cylinder


position="4 0.8 -5"


radius="0.5"


height="1.5"


color="#FFD166">


</a-cylinder>








<a-sky color="#ECECEC">


</a-sky>









</a-scene>









<script>


let scene=document.querySelector("#scene");




// ENTRAR VR


function entrarVR(){


scene.enterVR();


}







// ENTRAR AR


async function entrarAR(){



try{


let session = await navigator.xr.requestSession(

"immersive-ar",

{

requiredFeatures:[

"hit-test"

]

}

);



scene.renderer.xr.setSession(session);



}


catch(error){


alert(

"AR no disponible en este navegador"

);


}



}



</script>





</body>


</html>
